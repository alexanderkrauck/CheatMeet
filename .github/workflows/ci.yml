name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        installer: [npm, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        if: matrix.installer == 'bun'
        with:
          bun-version: 1.3.10
      - run: npm ci
        if: matrix.installer == 'npm'
      - run: bun install --frozen-lockfile
        if: matrix.installer == 'bun'
      - run: npm run lint
      - run: npm test
      - run: npm run test:pwa
      - run: git diff --exit-code -- package.json package-lock.json bun.lock
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify safe Cloud Run candidate configuration
        run: python3 -m unittest discover -s tests -p 'test_deploy_config.py'
      - name: Build and smoke-test the production container
        run: |
          docker build --tag baudoku:check .
          docker run --detach --name baudoku-check -p 8080:8080 -e PORT=8080 -e GEMINI_API_KEY=ci-smoke-test -e ASSEMBLYAI_API_KEY=ci-smoke-test baudoku:check
          trap 'docker rm -f baudoku-check' EXIT
          node scripts/smoke-deployment.mjs http://localhost:8080
  # Production deployment is temporarily disabled: pushes to main must not
  # release to Cloud Run until the rebuilt transcription pipeline has been
  # exercised against the live Gemini and Google accounts. Restore this job to
  # re-enable automatic deployment; .github/workflows/deploy.yml is unchanged.
