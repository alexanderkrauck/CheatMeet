name: Deploy production
on:
  workflow_call:
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: cheatmeet-production
  cancel-in-progress: false
jobs:
  cloud-run:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.MCP_PUBLIC_URL }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      # The MCP feature is owned by the deploy, so the service cannot drift from
      # the repo. The secret itself lives in Secret Manager; only its name is here.
      MCP_PUBLIC_URL: ${{ vars.MCP_PUBLIC_URL }}
      MCP_TOKEN_SECRET_NAME: ${{ vars.MCP_TOKEN_SECRET_NAME }}
      PROCESSING_QUEUE: ${{ vars.PROCESSING_QUEUE }}
      PROCESSING_WORKER_URL: ${{ vars.PROCESSING_WORKER_URL }}
      PROCESSING_SERVICE_ACCOUNT: ${{ vars.PROCESSING_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and publish the tested commit
        env:
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$REPOSITORY/cheatmeet:$GITHUB_SHA"
          docker build --tag "$image" .
          docker push "$image"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image")
          echo "DEPLOY_IMAGE=$digest" >> "$GITHUB_ENV"
      - name: Deploy candidate, smoke test, then move live traffic
        run: bash scripts/deploy-cloud-run.sh
