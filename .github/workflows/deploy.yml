name: Deploy production
on:
  workflow_call:
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: baudoku-production
  cancel-in-progress: false
jobs:
  cloud-run:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://drive-sync-notes-gma5yake7q-nw.a.run.app
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and publish the tested commit
        env:
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$REPOSITORY/baudoku:$GITHUB_SHA"
          docker build --tag "$image" .
          docker push "$image"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image")
          echo "DEPLOY_IMAGE=$digest" >> "$GITHUB_ENV"
      - name: Deploy candidate, smoke test, then move live traffic
        run: bash scripts/deploy-cloud-run.sh
